aid: kindred-ventures
name: Kindred Ventures
description: >-
  Kindred Ventures is a San Francisco-based, earliest-stage venture capital firm founded in 2014 by
  Steve Jang and led today as a partnership with Managing Partners Steve Jang and Kanyi Maqubela. The
  firm backs visionary and relentless founders building the future with technology and science,
  investing primarily at the pre-seed and seed stage and often partnering with entrepreneurs before a
  company is even formed. Kindred runs a deliberately concentrated, high-touch model of roughly 25
  companies per fund, and has backed 100+ startups whose aggregate market capitalization now exceeds
  $200B. It invests across AI and new computing, crypto/web3, fintech, consumer, health and wellness,
  climate tech, mobility and logistics, and developer tools and infrastructure. With around $600M in
  assets under management, notable investments and exits include Uber, Coinbase, Poshmark, Reddit,
  Postmates, Blue Bottle Coffee, Perplexity, Tala, Magic Eden, dYdX, and PlayAI (acquired by Meta in
  2025).
